version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: silenttrack-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - MAX_UPLOAD_SIZE_MB=500
      - MAX_VIDEO_DURATION_SEC=1800
      - JOB_TTL_SECONDS=3600
      - DEFAULT_SEPARATION_MODE=balanced
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: silenttrack-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
